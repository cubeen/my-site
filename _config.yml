title: Jakub Rogalski
tagline: Portfolio site
description: A portfolio site for Machine Learning Projects.
url: "https://cubeen.github.io"
baseurl: "/my-site"
avatar: /assets/img/rogalski.jpeg
author: Jakub Rogalski
timezone: Europe/London
