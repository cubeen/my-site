title: Jakub Rogalski
tagline: ML Engineer
description: A portfolio site for Machine Learning Projects
url: "https://rogalski.cc"
baseurl: ""
avatar: /assets/img/rogalski.jpg
author: Jakub Rogalski
timezone: Europe/London
lang: en

# Theme Selection (Restored)
theme: jekyll-theme-chirpy
theme_mode: 

# Pagination (Kept to ensure the homepage loop works)
paginate: 10

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# Build Settings
markdown: kramdown
highlighter: rouge

# Custom Collections for Sidebar Navigation
collections:
  tabs:
    output: true
    sort_by: order

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/