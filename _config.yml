title: Jakub Rogalski
tagline: ML Engineer
description: A portfolio site for Machine Learning Projects
url: "https://cubeen.github.io"
baseurl: "/my-site"
avatar: /assets/img/rogalski.jpeg
author: Jakub Rogalski
timezone: Europe/London
lang: en

# Theme Selection (Restored)
theme: jekyll-theme-chirpy
theme_mode: dark

# Pagination (Kept to ensure the homepage loop works)
paginate: 10

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Build Settings
markdown: kramdown
highlighter: rouge

# Scope Boundaries (Eliminates the 1970 ghost entry)
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page